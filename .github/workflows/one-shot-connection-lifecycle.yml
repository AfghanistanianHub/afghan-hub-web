name: One-shot connection lifecycle (secondary)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-connection-lifecycle.yml"

permissions:
  contents: read

concurrency:
  group: secondary-connection-lifecycle
  cancel-in-progress: false

jobs:
  connection-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AUTH_ACCEPTANCE_SUPABASE_URL: https://rurgmyiiytesknsfwjjl.supabase.co
      AUTH_ACCEPTANCE_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SECONDARY_PUBLISHABLE_KEY }}
      AUTH_ACCEPTANCE_MEMBER_A_EMAIL: ${{ secrets.ACCEPTANCE_MEMBER_A_EMAIL }}
      AUTH_ACCEPTANCE_MEMBER_A_PASSWORD: ${{ secrets.ACCEPTANCE_MEMBER_A_PASSWORD }}
      AUTH_ACCEPTANCE_MEMBER_B_EMAIL: ${{ secrets.ACCEPTANCE_MEMBER_B_EMAIL }}
      AUTH_ACCEPTANCE_MEMBER_B_PASSWORD: ${{ secrets.ACCEPTANCE_MEMBER_B_PASSWORD }}
      SECURITY_TEST_SUPABASE_URL: https://rurgmyiiytesknsfwjjl.supabase.co
      SECURITY_TEST_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SECONDARY_PUBLISHABLE_KEY }}
      CONNECTION_LIFECYCLE_ACCEPTANCE_MODE: write
      CONNECTION_LIFECYCLE_ACCEPTANCE_ALLOW_WRITES: I_UNDERSTAND_THIS_TOUCHES_ONLY_DISPOSABLE_SECONDARY_PERSONAS

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Guard secondary target and disposable personas
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTH_ACCEPTANCE_SUPABASE_URL" == "https://rurgmyiiytesknsfwjjl.supabase.co" ]]
          [[ -n "$AUTH_ACCEPTANCE_PUBLISHABLE_KEY" ]]
          [[ -n "$AUTH_ACCEPTANCE_MEMBER_A_EMAIL" && -n "$AUTH_ACCEPTANCE_MEMBER_A_PASSWORD" ]]
          [[ -n "$AUTH_ACCEPTANCE_MEMBER_B_EMAIL" && -n "$AUTH_ACCEPTANCE_MEMBER_B_PASSWORD" ]]
      - name: Qualify non-production target
        run: npm run security:qualify-target
      - name: Run connection lifecycle acceptance
        run: npm run acceptance:connection-lifecycle
