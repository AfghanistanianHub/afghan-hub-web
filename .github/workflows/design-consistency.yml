name: Cross-page design review
on:
  pull_request:
    branches: [feat/member-page-workspaces]
    paths: ['src/**', 'scripts/qa/**', '.github/workflows/design-consistency.yml']
permissions:
  contents: read
concurrency:
  group: design-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      - run: node scripts/qa/prepare-local-journey.mjs
      - name: Start disposable loopback stack
        run: |
          if ! supabase --workdir "$LOCAL_QA_DIR" start --exclude studio,logflare,vector,edge-runtime > "$RUNNER_TEMP/design-stack.log" 2>&1; then
            node scripts/qa/summarize-stack-error.mjs "$RUNNER_TEMP/design-stack.log"
            exit 1
          fi
      - name: Build pinned before source
        run: node scripts/qa/prepare-design-baseline.mjs
      - name: API and RLS regression
        run: node scripts/qa/local-member-journeys.mjs
      - name: Real synthetic-account browser review
        env:
          LOCAL_QA_VISUAL: '1'
          LOCAL_QA_DESIGN_REVIEW: '1'
        run: node scripts/qa/local-member-browser.mjs
      - name: Build browsable source-tagged gallery
        if: always()
        run: node scripts/qa/design-gallery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-page-design-review
          path: |
            reports/visual/
            reports/local-member-browser.json
            reports/local-member-journeys.json
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy isolated stack
        if: always() && env.LOCAL_QA_DIR != ''
        run: supabase --workdir "$LOCAL_QA_DIR" stop --no-backup
