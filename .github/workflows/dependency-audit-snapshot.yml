name: Dependency audit snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit-snapshot.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture npm audit JSON
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const vulns = report.vulnerabilities || {};
          const rows = Object.entries(vulns).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            via: Array.isArray(v.via)
              ? v.via.map(x => typeof x === "string" ? x : {
                  source: x.source,
                  name: x.name,
                  title: x.title,
                  url: x.url,
                  severity: x.severity,
                  range: x.range,
                })
              : v.via,
            effects: v.effects || [],
            range: v.range,
            nodes: v.nodes || [],
            fixAvailable: v.fixAvailable,
          }));
          console.log("AUDIT_METADATA", JSON.stringify(report.metadata || {}, null, 2));
          console.log("AUDIT_VULNERABILITIES", JSON.stringify(rows, null, 2));
          NODE
