name: Isolated local member journeys
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/qa/**'
      - 'supabase/**'
      - 'package*.json'
      - '.github/workflows/local-journey-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-journeys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        complete-pass: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: npm ci
      - name: Verify atomic model budget with disposable Redis
        run: node scripts/qa/model-budget-redis.mjs
      - name: Prepare fresh loopback-only fixture stack
        run: node scripts/qa/prepare-local-journey.mjs
      - name: Start local services and replay migrations
        run: |
          if ! supabase --workdir "$LOCAL_QA_DIR" start --exclude studio,logflare,vector,edge-runtime > "$RUNNER_TEMP/local-stack-start.log" 2>&1; then
            node scripts/qa/summarize-stack-error.mjs "$RUNNER_TEMP/local-stack-start.log"
            exit 1
          fi
      - name: Run real authenticated API and RLS journeys
        run: node scripts/qa/local-member-journeys.mjs
      - name: Complete sandboxed browser journeys and desktop/mobile evidence
        env:
          LOCAL_QA_VISUAL: "1"
        run: node scripts/qa/local-member-browser.mjs
      - name: Upload sanitized scenario results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-member-journey-results-pass-${{ matrix.complete-pass }}
          path: |
            reports/local-member-journeys.json
            reports/local-model-budget.json
            reports/local-member-browser.json
            reports/visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy this run's isolated stack
        if: always() && env.LOCAL_QA_DIR != ''
        run: supabase --workdir "$LOCAL_QA_DIR" stop --no-backup
