name: Prepare Next 16.3.8 security upgrade

on:
  push:
    branches:
      - security/next-16-3-8
    paths:
      - ".github/workflows/security-next-1638-upgrade.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: security/next-16-3-8
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - name: Update Next.js security patch
        run: npm install next@16.3.8 eslint-config-next@16.3.8 --save-exact --package-lock-only
      - name: Validate lockfile
        run: npm ci
      - name: Commit generated package files
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes generated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js to 16.3.8 security patch"
          git push origin HEAD:security/next-16-3-8
