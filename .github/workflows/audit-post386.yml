name: Post-386 dependency audit snapshot

on:
  push:
    branches:
      - audit/npm-post386-residuals
    paths:
      - ".github/workflows/audit-post386.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Full audit snapshot
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log(JSON.stringify({
            metadata: data.metadata,
            vulnerabilities: Object.values(data.vulnerabilities || {}).map(v => ({
              name: v.name,
              severity: v.severity,
              direct: v.isDirect,
              via: v.via,
              effects: v.effects,
              range: v.range,
              nodes: v.nodes,
              fixAvailable: v.fixAvailable
            }))
          }, null, 2));
          NODE
      - name: Production audit snapshot
        run: |
          npm audit --omit=dev --json > audit-prod.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('audit-prod.json','utf8'));
          console.log(JSON.stringify({metadata:data.metadata,vulnerabilities:data.vulnerabilities}, null, 2));
          NODE
