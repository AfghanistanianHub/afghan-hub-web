name: Bootstrap Next security lockfile

on:
  push:
    branches:
      - deps/next-security-upgrade

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Regenerate package metadata
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.4 eslint-config-next@16.3.4

      - name: Capture npm audit report
        run: npm audit --json > next-security-audit.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: next-security-audit
          path: next-security-audit.json
          if-no-files-found: error
          retention-days: 3

      - name: Commit generated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/next-security-lockfile.yml
          git add package.json package-lock.json
          git commit -m "chore: regenerate lockfile for Next security upgrade"
          git push origin HEAD:deps/next-security-upgrade
