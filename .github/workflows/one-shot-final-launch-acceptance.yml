name: One-shot final launch acceptance (secondary)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-final-launch-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: secondary-final-launch-acceptance
  cancel-in-progress: false

jobs:
  final-launch-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_ACCEPTANCE_SUPABASE_URL: https://rurgmyiiytesknsfwjjl.supabase.co
      AUTH_ACCEPTANCE_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SECONDARY_PUBLISHABLE_KEY }}
      AUTH_ACCEPTANCE_MEMBER_A_EMAIL: ${{ secrets.ACCEPTANCE_MEMBER_A_EMAIL }}
      AUTH_ACCEPTANCE_MEMBER_A_PASSWORD: ${{ secrets.ACCEPTANCE_MEMBER_A_PASSWORD }}
      AUTH_ACCEPTANCE_MEMBER_B_EMAIL: ${{ secrets.ACCEPTANCE_MEMBER_B_EMAIL }}
      AUTH_ACCEPTANCE_MEMBER_B_PASSWORD: ${{ secrets.ACCEPTANCE_MEMBER_B_PASSWORD }}
      AUTH_ACCEPTANCE_MODERATOR_EMAIL: ${{ secrets.ACCEPTANCE_MODERATOR_EMAIL }}
      AUTH_ACCEPTANCE_MODERATOR_PASSWORD: ${{ secrets.ACCEPTANCE_MODERATOR_PASSWORD }}
      AUTH_ACCEPTANCE_ADMIN_EMAIL: ${{ secrets.ACCEPTANCE_ADMIN_EMAIL }}
      AUTH_ACCEPTANCE_ADMIN_PASSWORD: ${{ secrets.ACCEPTANCE_ADMIN_PASSWORD }}
      SECURITY_TEST_SUPABASE_URL: https://rurgmyiiytesknsfwjjl.supabase.co
      SECURITY_TEST_PUBLISHABLE_KEY: ${{ secrets.ACCEPTANCE_SECONDARY_PUBLISHABLE_KEY }}
      OWNER_ACCEPTANCE_MODE: write
      OWNER_ACCEPTANCE_ALLOW_WRITES: I_UNDERSTAND_THIS_TOUCHES_ONLY_DISPOSABLE_SECONDARY_PERSONAS
      UNRELATED_RESPONDER_ACCEPTANCE_ALLOW_WRITES: I_UNDERSTAND_THIS_TOUCHES_ONLY_DISPOSABLE_SECONDARY_PERSONAS
      LISTING_VERIFICATION_ACCEPTANCE_ALLOW_WRITES: I_UNDERSTAND_THIS_TOUCHES_ONLY_DISPOSABLE_SECONDARY_PERSONAS
      SMOKE_BASE_URL: https://app.apnbc.ca

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Guard secondary target and disposable personas
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTH_ACCEPTANCE_SUPABASE_URL" == "https://rurgmyiiytesknsfwjjl.supabase.co" ]]
          [[ -n "$AUTH_ACCEPTANCE_PUBLISHABLE_KEY" ]]
          for persona in MEMBER_A MEMBER_B MODERATOR ADMIN; do
            email_var="AUTH_ACCEPTANCE_${persona}_EMAIL"
            password_var="AUTH_ACCEPTANCE_${persona}_PASSWORD"
            [[ -n "${!email_var}" && -n "${!password_var}" ]]
          done
      - name: Qualify non-production target
        run: npm run security:qualify-target
      - name: Disposable persona auth and sign-out acceptance
        run: npm run acceptance:auth
      - name: Production anonymous protected-route smoke
        run: npm run smoke:public
      - name: Owner submission acceptance
        run: npm run acceptance:owner-submissions
      - name: Incomplete discovery and unrelated responder acceptance
        run: npm run acceptance:unrelated-responder
      - name: Admin-only listing verification acceptance
        run: npm run acceptance:listing-verification
