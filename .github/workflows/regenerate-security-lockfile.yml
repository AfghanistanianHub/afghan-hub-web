name: Regenerate dependency security lockfile

on:
  push:
    branches:
      - security/remove-unused-shadcn-cli
    paths:
      - ".github/workflows/regenerate-security-lockfile.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: security/remove-unused-shadcn-cli
      - name: Use Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.x
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit all dependencies
        run: npm audit --json > audit-all.json || true
      - name: Audit production dependencies
        run: npm audit --omit=dev --json > audit-production.json || true
      - name: Print audit summaries
        run: |
          node -e "const a=require('./audit-all.json'); console.log('ALL', a.metadata?.vulnerabilities)"
          node -e "const a=require('./audit-production.json'); console.log('PRODUCTION', a.metadata?.vulnerabilities)"
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile after dependency security cleanup"
          git push origin HEAD:security/remove-unused-shadcn-cli
