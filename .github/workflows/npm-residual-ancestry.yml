name: Audit residual npm advisory ancestry

on:
  push:
    branches:
      - audit/npm-residual-ancestry

permissions:
  contents: read

jobs:
  ancestry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Capture dependency tree
        run: |
          npm ls hono js-yaml qs --all --json > npm-residual-tree.json || true
          {
            echo '=== hono ==='
            npm explain hono || true
            echo
            echo '=== js-yaml ==='
            npm explain js-yaml || true
            echo
            echo '=== qs ==='
            npm explain qs || true
          } > npm-residual-explain.txt

      - name: Upload ancestry report
        uses: actions/upload-artifact@v4
        with:
          name: npm-residual-ancestry
          path: |
            npm-residual-tree.json
            npm-residual-explain.txt
          if-no-files-found: error
          retention-days: 3
